name: Validate docs

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize] # This will trigger the workflow only when a PR is opened or updated with new commits

jobs:
  sushi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Sushi
        run: sudo npm install -g fsh-sushi

      - name: Validate with Sushi
        run: sushi .

  ig-publisher:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Xmx8g"

    steps:
      - uses: actions/checkout@v7

      - name: Install Jekyll
        run: sudo gem install jekyll

      - name: Install Sushi
        run: sudo npm install -g fsh-sushi

      # Download the publisher directly and invoke it without the wrapper scripts:
      # _updatePublisher.sh and _genonce.sh both probe the tx.fhir.org landing page
      # and abort (or silently fall back to -tx n/a, skipping terminology validation)
      # when that page is down even though the terminology API itself is up.
      - name: Install IG publisher
        run: |
          mkdir -p input-cache
          curl -fL --retry 3 --max-time 300 \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o input-cache/publisher.jar

      - name: Check that the IG builds successfully
        run: |
          java -Dfile.encoding=UTF-8 -Xmx10g -jar input-cache/publisher.jar -ig .
          echo "✅ IG built successfully"

      - name: Check QA report
        run: |
          # Configuration
          MAX_ALLOWED_ERRORS=0
          MAX_ALLOWED_WARNINGS=0

          if [ ! -f "output/qa.json" ]; then
            echo "❌ QA file not found: output/qa.json"
            exit 1
          fi

          # Extract errors and warnings from qa.json
          ERRORS=$(jq -r '.errs // 0' output/qa.json)
          WARNINGS=$(jq -r '.warnings // 0' output/qa.json)

          echo "  QA Results:"
          echo "   Errors: $ERRORS"
          echo "   Warnings: $WARNINGS"

          print_messages() {
            if [ -f "output/qa.txt" ]; then
              echo ""
              echo "::group::QA report (errors + unsuppressed warnings only)"
              # Drop:
              #  - per-file summary rows with no errors or warnings (info-only)
              #  - INFORMATION/HINT/NOTE detail lines
              # The remaining content is errors + warnings (warnings are already
              # filtered against ignoreWarnings.txt by the IG publisher).
              grep -vE '^ [^:]+ : 0 / 0 / [0-9]+$' output/qa.txt \
                | grep -vE '^ \* (INFORMATION|HINT|NOTE|INFO) :' \
                || true
              echo "::endgroup::"
            fi
          }

          # Check if errors exceed threshold
          if [ "$ERRORS" -gt $MAX_ALLOWED_ERRORS ]; then
            echo "❌ Too many errors: $ERRORS (maximum allowed: $MAX_ALLOWED_ERRORS known errors)"
            print_messages
            exit 1
          fi

          # Check if there are any warnings
          if [ "$WARNINGS" -gt $MAX_ALLOWED_WARNINGS ]; then
            echo "❌ Warnings found: $WARNINGS (maximum allowed: $MAX_ALLOWED_WARNINGS)"
            print_messages
            exit 1
          fi

          echo "✅ QA check passed: $ERRORS errors (≤$MAX_ALLOWED_ERRORS) and $WARNINGS warnings (≤$MAX_ALLOWED_WARNINGS)"

      # - name: Wait for deployment update
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     chmod +x ./.github/scripts/wait-for-deployment.sh
      #     ./.github/scripts/wait-for-deployment.sh https://dhp.uz/fhir/core/en/index.html 3600

      - name: Upload output folder
        if: always() && hashFiles('output/**/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ig-output-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
